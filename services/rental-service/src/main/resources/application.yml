server:
  port: 8083
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/drivesafe_rental}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:drivesafe_local}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
app:
  demo-data: ${DEMO_DATA_ENABLED:false}
  jwt:
    secret: ${JWT_SECRET:change-this-local-secret-change-this-local-secret}
  cors:
    allowed-origins: ${FRONTEND_ORIGINS:http://localhost:5173,http://localhost:3000}
  services:
    vehicle-url: ${VEHICLE_SERVICE_URL:http://localhost:8082}
